<mat-dialog-content class="mat-typography">
  <section class="cart-container">
    <section *ngIf="questions && questions.all_questions.length > 0; else empty_state"
             class="cart-container__content">
      <app-question-top-bar [topBarInformation]="{
          points: points,
          actualNumber: actualNumberQuestion + 1,
          allQuestionNumber: allQuestionNumber + 1
        }"></app-question-top-bar>

      <app-question-part [id]="actualQuestion.orig_id"
                         [questionText]='actualQuestion.text'></app-question-part>
      <app-answers-part [inputsFormGroup]='formGroup'
                        [showCorrectAnswers]="showCorrectAnswers"
                        [answers]='actualQuestion.subanswers'></app-answers-part>
      <app-functional-buttons (handlingCheckButton)=handlingCheckButton()
                              (handlingButtons)=handlingButtons($event)></app-functional-buttons>
      <div (click)="
                        pushQuestion()"
           *ngIf="gameMode === 'main'; else chosenAnswers"
           class="cart-container__handle-button-container">
        <img class="cart-container__handle-button"
             src="assets/img/plus.png"
             alt="">
      </div>
    </section>
  </section>
</mat-dialog-content>

<ng-template #chosenAnswers>
  <div (click)="popQuestion()"
       class="cart-container__handle-button-container cart-container__handle-button-container--minus-sign">
    <img class="cart-container__handle-button"
         src="assets/img/minus-sign.png"
         alt="">
  </div>
</ng-template>

<ng-template #empty_state>
  <div routerLink=""
       class="empty-state">
    <img class="empty-state__image"
         src="assets/img/back.png"
         alt="">
    <span
          class="empty-state__text">{{(sharedService.isPl$ | async) ? 'Wybierz pytanie z katalogu aby wyświetliły się w tym miejscu' : 'Select a question from the catalog to have it displayed here'}}</span>

  </div>
</ng-template>
